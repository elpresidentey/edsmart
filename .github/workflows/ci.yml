name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Basic repo sanity check
        run: |
          test -f index.html || (echo "index.html not found" && exit 1)
          echo "Repository files:" && ls -la

      - name: Set up Node.js if package.json exists
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (if Node project)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if [ -f pnpm-lock.yaml ]; then npm i -g pnpm && pnpm i; 
          elif [ -f yarn.lock ]; then npm i -g yarn && yarn install --frozen-lockfile; 
          else npm ci || npm install; fi

      - name: Run tests or build (if defined)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if npm run | grep -qE "test|build"; then 
            npm run test || true
            npm run build || true
          else
            echo "No test/build scripts defined; skipping"
          fi
